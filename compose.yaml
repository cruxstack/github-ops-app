services:
  server:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    env_file: .env
    environment:
      APP_LISTEN_ADDR: ":8080"
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # private keys referenced by *_PRIVATE_KEY_PATH, such as
      # /app/.local/github-private-key.pem
      - ./.local:/app/.local:ro
      # credentials saved by the installer (GITHUB_APP_INSTALLER_ENABLED)
      - installer-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null \"http://127.0.0.1:8080$${APP_BASE_PATH%/}/healthz\""]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  installer-data:
